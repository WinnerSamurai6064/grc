<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Green Recruiters - Hiring &amp; Screening Made Simple for Small Businesses</title>
<meta name="description" content="Green Recruiters is a small startup helping small businesses hire and screen employees with confidence. Simple, professional recruitment support.">
<meta name="keywords" content="Green Recruiters, recruitment, hiring, employee screening, small business hiring, recruitment startup">
<meta name="robots" content="index, follow">
<link rel="canonical" href="/">

<!-- Open Graph / social + AI crawler friendly metadata -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Green Recruiters">
<meta property="og:title" content="Green Recruiters - Hiring & Screening Made Simple">
<meta property="og:description" content="A small startup helping small businesses through the process of hiring and screening potential employees.">
<meta property="og:url" content="/">
<meta property="og:image" content="" id="ogImageMeta">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Green Recruiters">
<meta name="twitter:description" content="Helping small businesses hire and screen employees with confidence.">

<!-- Structured data for search engines and AI crawlers -->
<script type="application/ld+json" id="structuredData">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Green Recruiters",
  "description": "Green Recruiters is a small startup helping small businesses through the process of hiring and screening potential employees.",
  "url": "/"
}
</script>

<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FFFFFF;
    --text-primary: #2A2A26;
    --text-secondary: #6B6B63;
    --green: #2E7D4F;
    --green-dark: #1F5C39;
    --green-light: #E6F0EA;
    --border: #DDD8CC;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 48px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-img {
    height: 36px;
    width: auto;
    display: none;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--green-dark);
  }

  .apply-link {
    font-size: 14px;
    font-weight: 600;
    color: white;
    background: var(--green);
    padding: 10px 22px;
    border-radius: 999px;
    text-decoration: none;
    transition: background 0.2s ease;
  }

  .apply-link:hover {
    background: var(--green-dark);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 48px 60px;
  }

  .hero-wrapper {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: center;
  }

  .hero-copy .eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: var(--green-dark);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }

  .hero-copy h1 {
    font-size: 38px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 18px;
  }

  .hero-copy p {
    font-size: 16px;
    line-height: 1.7;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  .hero-image-box {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .hero-image-placeholder {
    color: var(--text-secondary);
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 780px) {
    .hero-wrapper {
      grid-template-columns: 1fr;
    }
    header {
      padding: 20px 24px;
    }
    main {
      padding: 20px 24px 40px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <img class="logo-img" id="logoImg" src="" alt="Green Recruiters logo">
    <span class="logo-text" id="logoText">Green Recruiters</span>
  </div>
  <a class="apply-link" href="/apply">Apply Now</a>
</header>

<main>
  <div class="hero-wrapper">
    <div class="hero-copy">
      <div class="eyebrow">Green Recruiters</div>
      <h1>Welcome to Green Recruiters</h1>
      <p>
        We are a small startup helping small businesses through the process of
        hiring and screening possibly employees, and we are delighted to do so.
      </p>
      <a class="apply-link" href="/apply">Start an Application</a>
    </div>

    <div class="hero-image-box" id="heroImageBox">
      <img id="companyImage" src="" alt="Green Recruiters team at work">
      <span class="hero-image-placeholder" id="heroImagePlaceholder">Company image</span>
    </div>
  </div>
</main>

<footer>
  Green Recruiters&nbsp;&copy;
</footer>

<script>
(function () {
  fetch('/api/public/settings')
    .then(res => res.json())
    .then(settings => {
      if (settings.site_title) {
        document.title = `${settings.site_title} - Hiring & Screening Made Simple for Small Businesses`;
        document.getElementById('logoText').textContent = settings.site_title;
      }

      if (settings.favicon) {
        document.getElementById('favicon').href = settings.favicon;
      }

      if (settings.home_logo) {
        const logoImg = document.getElementById('logoImg');
        logoImg.src = settings.home_logo;
        logoImg.style.display = 'block';
        document.getElementById('logoText').style.display = 'none';
      }

      if (settings.home_company_image) {
        const companyImage = document.getElementById('companyImage');
        companyImage.src = settings.home_company_image;
        companyImage.style.display = 'block';
        document.getElementById('heroImagePlaceholder').style.display = 'none';
        document.getElementById('ogImageMeta').setAttribute('content', settings.home_company_image);
      }
    })
    .catch(() => {
      // Home page remains fully functional with default copy if settings fail to load.
    });
})();
</script>

</body>
</html>
