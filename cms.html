<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Recruiters - CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FFFFFF;
    --text-primary: #2A2A26;
    --text-secondary: #6B6B63;
    --green: #2E7D4F;
    --green-dark: #1F5C39;
    --green-light: #E6F0EA;
    --border: #DDD8CC;
    --error: #B3261E;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--green-dark);
    padding: 0 12px 20px;
  }

  .nav-item {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-item:hover {
    background: var(--green-light);
    color: var(--text-primary);
  }

  .nav-item.active {
    background: var(--green);
    color: white;
  }

  .nav-spacer { flex: 1; }

  .logout-btn {
    padding: 12px 14px;
    font-size: 14px;
    color: var(--error);
    cursor: pointer;
    border-radius: 10px;
  }

  .logout-btn:hover {
    background: #FBEAE9;
  }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    padding: 36px 44px;
    max-width: 1100px;
  }

  .page {
    display: none;
  }

  .page.visible {
    display: block;
  }

  .page-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }

  /* ---------- Applications ---------- */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .app-card:hover {
    border-color: var(--green);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .app-card-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .app-card-job {
    font-size: 13px;
    color: var(--green-dark);
    margin-bottom: 10px;
  }

  .app-card-meta {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
  }

  .status-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--green-light);
    color: var(--green-dark);
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .modal-overlay.visible {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 16px;
  }

  .detail-label {
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .detail-value {
    text-align: right;
    word-break: break-word;
  }

  .modal-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  /* ---------- Forms / Inputs ---------- */
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .field-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input, select, textarea {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--green);
  }

  textarea {
    min-height: 140px;
    resize: vertical;
    font-family: 'Consolas', monospace;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: var(--green);
    color: white;
    transition: background 0.2s ease, opacity 0.2s ease;
  }

  .btn:hover { background: var(--green-dark); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-secondary {
    background: var(--bg);
    color: var(--text-primary);
    border: 1.5px solid var(--border);
  }

  .btn-secondary:hover { background: var(--green-light); }

  .btn-danger {
    background: var(--error);
  }

  .btn-danger:hover { background: #921f19; }

  .btn-small {
    padding: 7px 14px;
    font-size: 12px;
  }

  /* ---------- Settings ---------- */
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .settings-grid.single { grid-template-columns: 1fr; }

  .asset-preview {
    width: 100%;
    height: 120px;
    border-radius: 10px;
    background: var(--bg);
    border: 1.5px dashed var(--border);
    object-fit: cover;
    margin-bottom: 10px;
  }

  /* ---------- Jobs ---------- */
  .job-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .job-actions { display: flex; gap: 8px; align-items: center; }

  /* ---------- Documents ---------- */
  .doc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .doc-name { font-weight: 600; }
  .doc-meta { font-size: 12px; color: var(--text-secondary); }

  /* ---------- Email panel ---------- */
  .recipients-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .attachment-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }

  .attachment-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    background: var(--bg);
    padding: 8px 12px;
    border-radius: 8px;
  }

  .attachment-remove {
    color: var(--error);
    cursor: pointer;
    font-weight: 600;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text-primary);
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 200;
  }

  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .empty-state {
    color: var(--text-secondary);
    font-size: 14px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">Green Recruiters</div>
  <div class="nav-item active" data-page="applications">Applications</div>
  <div class="nav-item" data-page="documents">Documents</div>
  <div class="nav-item" data-page="settings">Site Settings</div>
  <div class="nav-item" data-page="jobs">Jobs</div>
  <div class="nav-item" data-page="email">Email</div>
  <div class="nav-spacer"></div>
  <div class="logout-btn" id="logoutBtn">Log Out</div>
</div>

<div class="main">

  <!-- Applications Page -->
  <div class="page visible" data-page="applications">
    <div class="page-title">Applications</div>
    <div class="app-grid" id="applicationsGrid"></div>
    <div class="empty-state" id="applicationsEmpty" style="display:none;">No applications yet.</div>
  </div>

  <!-- Documents Page -->
  <div class="page" data-page="documents">
    <div class="page-title">Documents</div>
    <div class="card" id="documentsCard"></div>
  </div>

  <!-- Settings Page -->
  <div class="page" data-page="settings">
    <div class="page-title">Site Settings</div>

    <div class="card">
      <div class="settings-grid">
        <div class="field-group">
          <label class="field-label">Hero Image</label>
          <img class="asset-preview" id="heroImagePreview" src="">
          <input type="file" id="heroImageInput" accept="image/*">
        </div>
        <div class="field-group">
          <label class="field-label">Favicon</label>
          <img class="asset-preview" id="faviconPreview" src="">
          <input type="file" id="faviconInput" accept="image/*">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="settings-grid single">
        <div class="field-group">
          <label class="field-label">Site Title</label>
          <input type="text" id="setting-site_title">
        </div>
        <div class="field-group">
          <label class="field-label">Hero Heading</label>
          <input type="text" id="setting-hero_heading">
        </div>
        <div class="field-group">
          <label class="field-label">Hero Subtitle</label>
          <input type="text" id="setting-hero_subtitle">
        </div>
        <div class="field-group">
          <label class="field-label">Contact Email</label>
          <input type="text" id="setting-contact_email">
        </div>
        <div class="field-group">
          <label class="field-label">Contact Phone</label>
          <input type="text" id="setting-contact_phone">
        </div>
      </div>
      <button class="btn" id="saveSettingsBtn">Save Settings</button>
    </div>
  </div>

  <!-- Jobs Page -->
  <div class="page" data-page="jobs">
    <div class="page-title">Jobs</div>

    <div class="card">
      <div class="field-group">
        <label class="field-label">Add New Job</label>
        <div style="display:flex; gap:10px;">
          <input type="text" id="newJobTitle" placeholder="e.g. Product Manager">
          <button class="btn" id="addJobBtn" style="flex-shrink:0;">Add Job</button>
        </div>
      </div>
    </div>

    <div class="card" id="jobsList"></div>
  </div>

  <!-- Email Page -->
  <div class="page" data-page="email">
    <div class="page-title">Send Email</div>

    <div class="card">
      <div class="field-group">
        <label class="field-label">To (comma-separated)</label>
        <input type="text" id="emailTo" placeholder="applicant@example.com">
      </div>

      <div class="recipients-row">
        <div class="field-group">
          <label class="field-label">CC</label>
          <input type="text" id="emailCc">
        </div>
        <div class="field-group">
          <label class="field-label">BCC</label>
          <input type="text" id="emailBcc">
        </div>
        <div class="field-group">
          <label class="field-label">Subject</label>
          <input type="text" id="emailSubject">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">HTML Body</label>
        <textarea id="emailBody" placeholder="<p>Write your email here. Inline CSS is supported.</p>"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">Attachments</label>
        <input type="file" id="emailAttachments" multiple>
        <div class="attachment-list" id="attachmentList"></div>
      </div>

      <button class="btn" id="sendEmailBtn">Send Email</button>
    </div>

    <div class="card">
      <div class="page-title" style="font-size:16px; margin-bottom:14px;">Recent Sends</div>
      <div id="emailLogList"></div>
    </div>
  </div>

</div>

<!-- Application Detail Modal -->
<div class="modal-overlay" id="appModalOverlay">
  <div class="modal">
    <div class="modal-title">Application Detail</div>
    <div id="appModalBody"></div>
    <div class="modal-actions">
      <select id="statusSelect" style="flex:1;">
        <option>Received</option>
        <option>Under Review</option>
        <option>Shortlisted</option>
        <option>Interview</option>
        <option>Rejected</option>
        <option>Hired</option>
      </select>
      <button class="btn btn-small" id="updateStatusBtn">Update Status</button>
      <button class="btn btn-secondary btn-small" id="closeModalBtn">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const API_BASE = '';
  const token = sessionStorage.getItem('gr_session_token');

  if (!token) {
    window.location.href = '/admin';
    return;
  }

  function authHeaders(extra) {
    return Object.assign({ 'Authorization': `Bearer ${token}` }, extra || {});
  }

  async function apiFetch(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: authHeaders(options.headers),
    });
    if (res.status === 401) {
      sessionStorage.removeItem('gr_session_token');
      window.location.href = '/admin';
      throw new Error('Session expired.');
    }
    return res;
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2600);
  }

  // ---------- Navigation ----------
  const navItems = document.querySelectorAll('.nav-item');
  const pages = document.querySelectorAll('.page');

  navItems.forEach(item => {
    item.addEventListener('click', () => {
      const target = item.dataset.page;
      navItems.forEach(n => n.classList.toggle('active', n === item));
      pages.forEach(p => p.classList.toggle('visible', p.dataset.page === target));

      if (target === 'applications') loadApplications();
      if (target === 'documents') loadDocuments();
      if (target === 'settings') loadSettings();
      if (target === 'jobs') loadJobs();
      if (target === 'email') loadEmailLog();
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('gr_session_token');
    window.location.href = '/admin';
  });

  // ---------- Applications ----------
  let applicationsCache = [];

  async function loadApplications() {
    const res = await apiFetch('/api/cms/applications');
    applicationsCache = await res.json();

    const grid = document.getElementById('applicationsGrid');
    const empty = document.getElementById('applicationsEmpty');
    grid.innerHTML = '';

    if (applicationsCache.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    applicationsCache.forEach(app => {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.innerHTML = `
        <div class="app-card-name">${escapeHtml(app.full_name)}</div>
        <div class="app-card-job">${escapeHtml(app.applying_for)}</div>
        <div class="app-card-meta">
          <span>${escapeHtml(app.residence_country)}</span>
          <span class="status-pill">${escapeHtml(app.status)}</span>
        </div>
        <div class="app-card-meta" style="margin-top:6px;">
          <span>${new Date(app.submitted_at).toLocaleDateString()}</span>
        </div>
      `;
      card.addEventListener('click', () => openApplicationModal(app.id));
      grid.appendChild(card);
    });
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(value);
    return div.innerHTML;
  }

  let activeApplicationId = null;

  async function openApplicationModal(applicationId) {
    const res = await apiFetch(`/api/cms/applications/${applicationId}`);
    const app = await res.json();
    activeApplicationId = applicationId;

    const fieldLabels = {
      full_name: 'Full Name',
      primary_email: 'Primary Email',
      secondary_email: 'Secondary Email',
      phone_country_code: 'Phone Code',
      phone_number: 'Phone Number',
      residence_country: 'Residence',
      nationality: 'Nationality',
      applying_for: 'Position',
      linkedin_url: 'LinkedIn',
      telegram_country_code: 'Telegram Code',
      telegram_number: 'Telegram Number',
      resume_filename: 'Resume File',
      submitted_at: 'Submitted',
      status: 'Status',
    };

    const body = document.getElementById('appModalBody');
    body.innerHTML = '';

    Object.entries(fieldLabels).forEach(([key, label]) => {
      if (!app[key]) return;
      const row = document.createElement('div');
      row.className = 'detail-row';
      row.innerHTML = `<span class="detail-label">${label}</span><span class="detail-value">${escapeHtml(app[key])}</span>`;
      body.appendChild(row);
    });

    document.getElementById('statusSelect').value = app.status;
    document.getElementById('appModalOverlay').classList.add('visible');
  }

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('appModalOverlay').classList.remove('visible');
  });

  document.getElementById('updateStatusBtn').addEventListener('click', async () => {
    const newStatus = document.getElementById('statusSelect').value;
    const formData = new FormData();
    formData.append('new_status', newStatus);

    await apiFetch(`/api/cms/applications/${activeApplicationId}/status`, {
      method: 'PATCH',
      body: formData,
    });

    showToast('Status updated.');
    document.getElementById('appModalOverlay').classList.remove('visible');
    loadApplications();
  });

  // ---------- Documents ----------
  async function loadDocuments() {
    const res = await apiFetch('/api/cms/documents');
    const docs = await res.json();
    const container = document.getElementById('documentsCard');
    container.innerHTML = '';

    if (docs.length === 0) {
      container.innerHTML = '<div class="empty-state">No documents uploaded yet.</div>';
      return;
    }

    docs.forEach(doc => {
      const row = document.createElement('div');
      row.className = 'doc-row';
      row.innerHTML = `
        <div>
          <div class="doc-name">${escapeHtml(doc.resume_filename)}</div>
          <div class="doc-meta">${escapeHtml(doc.full_name)} · ${(doc.resume_size / 1024).toFixed(0)} KB</div>
        </div>
        <button class="btn btn-small btn-secondary">Download</button>
      `;
      row.querySelector('button').addEventListener('click', () => downloadDocument(doc.application_id));
      container.appendChild(row);
    });
  }

  async function downloadDocument(applicationId) {
    const res = await apiFetch(`/api/cms/documents/${applicationId}/download`);
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
  }

  // ---------- Settings ----------
  async function loadSettings() {
    const res = await apiFetch('/api/cms/settings');
    const settings = await res.json();

    ['site_title', 'hero_heading', 'hero_subtitle', 'contact_email', 'contact_phone'].forEach(key => {
      const el = document.getElementById(`setting-${key}`);
      if (el) el.value = settings[key] || '';
    });

    document.getElementById('heroImagePreview').src = settings.hero_image || '';
    document.getElementById('faviconPreview').src = settings.favicon || '';
  }

  document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
    const keys = ['site_title', 'hero_heading', 'hero_subtitle', 'contact_email', 'contact_phone'];

    for (const key of keys) {
      const value = document.getElementById(`setting-${key}`).value;
      const formData = new FormData();
      formData.append('setting_value', value);
      await apiFetch(`/api/cms/settings/${key}`, { method: 'PUT', body: formData });
    }

    showToast('Settings saved.');
  });

  document.getElementById('heroImageInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await uploadAsset('hero_image', file, 'heroImagePreview');
  });

  document.getElementById('faviconInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await uploadAsset('favicon', file, 'faviconPreview');
  });

  async function uploadAsset(settingKey, file, previewId) {
    const formData = new FormData();
    formData.append('asset', file);

    const res = await apiFetch(`/api/cms/settings/${settingKey}/asset`, {
      method: 'PUT',
      body: formData,
    });

    if (res.ok) {
      const data = await res.json();
      document.getElementById(previewId).src = data.path;
      showToast('Image uploaded.');
    } else {
      showToast('Upload failed.');
    }
  }

  // ---------- Jobs ----------
  async function loadJobs() {
    const res = await apiFetch('/api/cms/jobs');
    const jobs = await res.json();
    const container = document.getElementById('jobsList');
    container.innerHTML = '';

    if (jobs.length === 0) {
      container.innerHTML = '<div class="empty-state">No jobs added yet.</div>';
      return;
    }

    jobs.forEach(job => {
      const row = document.createElement('div');
      row.className = 'job-row';
      row.innerHTML = `
        <span>${escapeHtml(job.title)}</span>
        <div class="job-actions">
          <span class="status-pill" style="background:${job.active ? '#E6F0EA' : '#F0F0EC'}; color:${job.active ? '#1F5C39' : '#6B6B63'};">
            ${job.active ? 'Active' : 'Inactive'}
          </span>
          <button class="btn btn-small btn-secondary toggle-btn">${job.active ? 'Deactivate' : 'Activate'}</button>
          <button class="btn btn-small btn-danger delete-btn">Delete</button>
        </div>
      `;
      row.querySelector('.toggle-btn').addEventListener('click', () => toggleJob(job.id, !job.active));
      row.querySelector('.delete-btn').addEventListener('click', () => deleteJob(job.id));
      container.appendChild(row);
    });
  }

  async function toggleJob(jobId, active) {
    const formData = new FormData();
    formData.append('active', active);
    await apiFetch(`/api/cms/jobs/${jobId}`, { method: 'PATCH', body: formData });
    loadJobs();
  }

  async function deleteJob(jobId) {
    if (!confirm('Delete this job permanently?')) return;
    await apiFetch(`/api/cms/jobs/${jobId}`, { method: 'DELETE' });
    loadJobs();
  }

  document.getElementById('addJobBtn').addEventListener('click', async () => {
    const input = document.getElementById('newJobTitle');
    const title = input.value.trim();
    if (!title) return;

    const formData = new FormData();
    formData.append('title', title);
    await apiFetch('/api/cms/jobs', { method: 'POST', body: formData });

    input.value = '';
    loadJobs();
  });

  // ---------- Email ----------
  let pendingAttachments = [];

  document.getElementById('emailAttachments').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);

    for (const file of files) {
      const base64 = await fileToBase64(file);
      pendingAttachments.push({
        filename: file.name,
        content_base64: base64,
        content_type: file.type || 'application/octet-stream',
      });
    }

    renderAttachmentList();
    e.target.value = '';
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderAttachmentList() {
    const list = document.getElementById('attachmentList');
    list.innerHTML = '';

    pendingAttachments.forEach((att, index) => {
      const item = document.createElement('div');
      item.className = 'attachment-item';
      item.innerHTML = `<span>${escapeHtml(att.filename)}</span><span class="attachment-remove">Remove</span>`;
      item.querySelector('.attachment-remove').addEventListener('click', () => {
        pendingAttachments.splice(index, 1);
        renderAttachmentList();
      });
      list.appendChild(item);
    });
  }

  function parseAddressList(value) {
    return value.split(',').map(s => s.trim()).filter(Boolean);
  }

  document.getElementById('sendEmailBtn').addEventListener('click', async () => {
    const to = parseAddressList(document.getElementById('emailTo').value);
    const cc = parseAddressList(document.getElementById('emailCc').value);
    const bcc = parseAddressList(document.getElementById('emailBcc').value);
    const subject = document.getElementById('emailSubject').value.trim();
    const htmlBody = document.getElementById('emailBody').value;

    if (to.length === 0 || !subject) {
      showToast('Recipient and subject are required.');
      return;
    }

    const sendBtn = document.getElementById('sendEmailBtn');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending...';

    try {
      const res = await apiFetch('/api/cms/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to, cc, bcc, subject,
          html_body: htmlBody,
          attachments: pendingAttachments,
        }),
      });

      if (res.ok) {
        showToast('Email sent.');
        document.getElementById('emailTo').value = '';
        document.getElementById('emailCc').value = '';
        document.getElementById('emailBcc').value = '';
        document.getElementById('emailSubject').value = '';
        document.getElementById('emailBody').value = '';
        pendingAttachments = [];
        renderAttachmentList();
        loadEmailLog();
      } else {
        showToast('Failed to send email.');
      }
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send Email';
    }
  });

  async function loadEmailLog() {
    const res = await apiFetch('/api/cms/email/log');
    const logs = await res.json();
    const container = document.getElementById('emailLogList');
    container.innerHTML = '';

    if (logs.length === 0) {
      container.innerHTML = '<div class="empty-state">No emails sent yet.</div>';
      return;
    }

    logs.slice(0, 20).forEach(log => {
      const row = document.createElement('div');
      row.className = 'doc-row';
      row.innerHTML = `
        <div>
          <div class="doc-name">${escapeHtml(log.subject || '(no subject)')}</div>
          <div class="doc-meta">${escapeHtml(log.recipient)} · ${new Date(log.sent_at).toLocaleString()}</div>
        </div>
        <span class="status-pill" style="background:${log.status === 'sent' ? '#E6F0EA' : '#FBEAE9'}; color:${log.status === 'sent' ? '#1F5C39' : '#B3261E'};">
          ${escapeHtml(log.status)}
        </span>
      `;
      container.appendChild(row);
    });
  }

  // ---------- Init ----------
  loadApplications();
})();
</script>

</body>
</html>
